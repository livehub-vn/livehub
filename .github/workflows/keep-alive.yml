name: LiveHub & Supabase Keep-Alive

on:
  schedule:
    # Chạy tự động mỗi 6 tiếng một lần (00:00, 06:00, 12:00, 18:00 UTC)
    # Đảm bảo Supabase (7 ngày không hoạt động sẽ bị pause) và LiveHub luôn active 24/7
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất kỳ lúc nào để kiểm tra
    inputs:
      custom_url:
        description: 'Tùy chọn: URL ứng dụng cần ping (VD: https://livehub.vn)'
        required: false
        default: ''

jobs:
  heartbeat:
    name: 💓 Ping Supabase & LiveHub Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Run Keep-Alive Trigger Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIVEHUB_APP_URL: ${{ github.event.inputs.custom_url || secrets.LIVEHUB_APP_URL }}
        run: |
          node scripts/keep-alive.mjs
